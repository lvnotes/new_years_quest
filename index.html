<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мурко і чарівний мішок</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--night:#13263f;--gold:#f2b84b;--paper:#fff6e2;--ink:#2b2118;--ok:#3d9a5b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);font-family:Nunito,system-ui,sans-serif;color:var(--paper)}
body{display:flex;flex-direction:column}
.hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0d1b2e;border-bottom:2px solid var(--gold)}
.hud h1{font-size:16px;margin:0;font-weight:800;flex:1;line-height:1.1}
.slots{display:flex;gap:5px}
.slot{width:30px;height:34px;border-radius:7px;border:2px dashed #5a7090;display:grid;place-items:center;font-weight:800;font-size:18px;color:#5a7090}
.slot.on{border:2px solid var(--gold);background:var(--gold);color:var(--ink)}
.rs{background:none;border:0;color:#8aa0bd;font-size:20px;cursor:pointer}
.wrap{flex:1;min-height:0;overflow:auto}
.map{position:relative;width:max(min(100%,calc((100vh - 64px)*1.8333)),1000px);aspect-ratio:1408/768;margin:0 auto}
.map>img{width:100%;height:100%;display:block}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.seg{fill:none;stroke:#fff6e2;stroke-width:3.5;stroke-dasharray:3 10;stroke-linecap:round;opacity:.8}
.seg.done{stroke:var(--gold);stroke-dasharray:none;opacity:1;stroke-width:4.5}
.pt{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;font-family:inherit;z-index:2}
.pt i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;margin:auto;background:#fff6e2;border:3px solid var(--ink);font:800 17px Nunito,sans-serif;color:var(--ink);font-style:normal}
.pt b{display:block;margin-top:3px;padding:1px 8px;border-radius:9px;background:rgba(19,38,63,.88);color:var(--paper);font-size:13px;white-space:nowrap}
.pt.lock i{background:#9aa6b5;border-color:#55606e}
.pt.done i{background:var(--ok);color:#fff;border-color:#1f5c35}
.pt.cur i{background:var(--gold);animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.2);box-shadow:0 0 0 10px rgba(242,184,75,.3)}}
.murko{position:absolute;width:5.4%;transform:translate(-50%,-90%);z-index:3;pointer-events:none}
.murko img{width:100%;display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.murko.walk img{animation:bob .42s infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.ov{position:fixed;inset:0;background:rgba(8,16,30,.72);display:none;align-items:flex-end;justify-content:center;z-index:9}
.ov.show{display:flex}
.card{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;padding:20px 20px 24px;text-align:center;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.card .av{font-size:54px;line-height:1}
.card h2{margin:6px 0 4px;font-size:22px}
.card p{margin:8px 0;font-size:17px;line-height:1.4}
.card .spr{height:130px;margin-bottom:4px}
.stub{margin:12px 0;padding:14px;border:2px dashed #b79a63;border-radius:14px;font-weight:800;background:#fbeccb}
.btn{display:inline-block;margin-top:8px;padding:12px 26px;border:0;border-radius:14px;background:var(--ok);color:#fff;font:800 18px Nunito,sans-serif;cursor:pointer;text-decoration:none}
.big{font-size:48px;font-weight:800;color:#c4811a;line-height:1.1}
.cw{--s:min(26px,calc((100vw - 56px)/12));text-align:left}
.cl{margin:9px 0 3px;font-size:14px;font-weight:800}
.cr{display:flex;gap:2px}
.cr input{width:var(--s);height:calc(var(--s) + 4px);padding:0;text-align:center;font:800 16px Nunito,sans-serif;text-transform:uppercase;color:var(--ink);background:#fff;border:2px solid #8a6f3e;border-radius:5px}
.cr input.k{background:#ffe08a;border-color:#c4811a}
.cr input.ok{background:#bfe8c9;border-color:var(--ok)}
.cr input.bad{background:#f6c4c0;border-color:#c0392b}
.cmsg{margin:12px 0 0;font-weight:800;text-align:center;min-height:22px}
.pb{text-align:left;margin:12px 0}.pb p{margin:0 0 6px;font-size:16px;line-height:1.35}
.dg{width:56px;height:48px;padding:0;text-align:center;font:800 24px Nunito,sans-serif;border:2px solid #8a6f3e;border-radius:10px;background:#fff;color:var(--ink)}
.dg.ok{background:#bfe8c9;border-color:var(--ok)}.dg.bad{background:#f6c4c0;border-color:#c0392b}
.lock{font-size:24px;font-weight:800;text-align:center;margin-top:10px;letter-spacing:8px}
.cl2{margin:6px 0 0;padding-left:22px;font-size:16px;line-height:1.4;text-align:left}
.lr{margin:8px 0;padding:8px;border-radius:12px;background:#fbeccb;border:2px solid transparent;text-align:left}
.lr.ok{border-color:var(--ok);background:#dff3e5}.lr.bad{border-color:#c0392b;background:#fadad6}
.lr>b{display:block;margin-bottom:5px}.gs{display:flex;gap:6px}
.gb{flex:1;min-width:0;padding:5px 1px;border:2px solid #b79a63;border-radius:10px;background:#fff;font:700 12px Nunito,sans-serif;color:var(--ink);cursor:pointer}
.gb i{display:block;font-style:normal;font-size:24px;line-height:1.2}.gb.sel{background:#ffe08a;border-color:#c4811a}
.card{position:relative}
.x{position:absolute;top:6px;right:10px;width:40px;height:40px;border:0;background:none;font-size:26px;color:#8a6f3e;cursor:pointer}
.btn2{background:#8a6f3e;margin-left:6px}
.opt{display:block;width:100%;margin:6px 0;padding:11px 12px;text-align:left;font:700 16px Nunito,sans-serif;border:2px solid #b79a63;border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.opt.ok{background:#bfe8c9;border-color:var(--ok)}.opt.bad{background:#f6c4c0;border-color:#c0392b}
.qq{font-size:18px;font-weight:800;margin:6px 0;text-align:left}.qn{font-size:14px;text-align:left;color:#8a6f3e;margin:2px 0}
.ng{display:grid;grid-template-columns:auto repeat(10,var(--cs));margin:8px auto;width:max-content;max-width:100%}
.nc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font:700 11px/1.15 Nunito,sans-serif;padding-bottom:3px;color:var(--ink)}
.nr{display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-right:5px;font:700 12px Nunito,sans-serif;color:var(--ink)}
.gc{width:var(--cs);height:var(--cs);border:1px solid #b79a63;background:#fff;display:grid;place-items:center;font-size:calc(var(--cs)*.6);cursor:pointer;user-select:none;touch-action:none}
.gc.m::after{content:"✕";color:#9a8a6a}.gc.f{background:#3b3226}.gc.f.ok{background:var(--ok)}.gc.f.bad{background:#c0392b}.gc.f.win{background:#e8962e}
.gc.r5{border-right:2px solid var(--ink)}.gc.b5{border-bottom:2px solid var(--ink)}
.mb{padding:8px 12px;border:2px solid #8a6f3e;border-radius:10px;background:#fff;font:800 14px Nunito,sans-serif;margin:4px;cursor:pointer;color:var(--ink)}.mb.on{background:#ffe08a}
.gh{font-weight:800;font-size:15px;margin:0 40px 6px 0;text-align:left}.gh span{font-size:24px;vertical-align:middle}
.av.happy{display:inline-block;animation:hop .8s ease-in-out 3}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) scale(1.12)}}
@media (max-width:430px){.slot{width:26px;height:30px;font-size:16px}.hud h1{font-size:14px}}
.hud h1{min-width:0}
.pair{display:flex;align-items:flex-end;justify-content:center;gap:16px}
.pair img{animation:hop .8s ease-in-out .15s 3}
.gc.hint{outline:3px solid #e8962e;outline-offset:-3px;position:relative;z-index:1}
.sd{display:grid;grid-template-columns:repeat(6,var(--sc));width:max-content;margin:8px auto;border:3px solid var(--ink)}
.sc{width:var(--sc);height:var(--sc);border:1px solid #b79a63;background:#fff;display:grid;place-items:center;font:800 calc(var(--sc)*.55) Nunito,sans-serif;color:var(--ink);cursor:pointer;user-select:none;touch-action:manipulation}
.sc.g{background:#f1e3c2;cursor:default}.sc.u{color:#2a5db0}.sc.sel{outline:3px solid #e8962e;outline-offset:-3px;background:#ffe9b0}
.sc.ok{background:#bfe8c9}.sc.bad{background:#f6c4c0}.sc.hint{background:#ffe08a}.sc.r3{border-right:3px solid var(--ink)}.sc.b2{border-bottom:3px solid var(--ink)}
.kp{display:flex;gap:5px;justify-content:center;margin:8px 0}.kp button{flex:1;max-width:46px;height:48px;font:800 22px Nunito,sans-serif;border:2px solid #8a6f3e;border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation}
.chr{height:150px;display:block;margin:0 auto 6px}.pair .chr{height:130px;margin:0}
.gh img{height:44px;vertical-align:middle;margin-right:6px}
.ng.big .nc{font-size:17px}.ng.big .nr{font-size:19px;gap:7px}
.ng{touch-action:none;user-select:none}
@media (min-width:700px){.ov{align-items:center}.card{width:min(580px,100%);border-radius:22px;max-height:88vh;padding:24px 28px 28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

 const runs=a=>{const o=[];let c=0;a.forEach(v=>{if(v)c++;else if(c){o.push(c);c=0}});if(c)o.push(c);return o.length?o:[0]};
 const rc=sol.map(runs),cc=[...Array(N).keys()].map(j=>runs(sol.map(r=>r[j])));
 const st=sol.map(r=>r.map(()=>0));let mode=1,lock=false,hints=3;const steps=ngSteps(rc,cc,N);
 let g='<div></div>'+cc.map(c=>`<div class="nc">${c.map(x=>`<span>${x}</span>`).join("")}</div>`).join("");
 rc.forEach((c,i)=>{g+=`<div class="nr">${c.join(" ")}</div>`;for(let j=0;j<N;j++)g+=`<div class="gc${N>5&&j===4?" r5":""}${N>5&&i===4?" b5":""}" data-r="${i}" data-c="${j}"></div>`});
 el.innerHTML=`<div class="cw" style="--cs:min(${N>5?26:46}px,calc((100vw - ${N>5?120:130}px)/${N}))"><p style="font-size:15px;text-align:center"><b>Рівень 1.</b> Числа показують, скільки клітинок підряд треба зафарбувати в рядку чи стовпчику. Зафарбуй їх — і з’явиться малюнок.</p><div style="text-align:center"><button class="mb on" id="m1">■ Зафарбувати</button><button class="mb" id="m2">✕ Порожня</button><button class="mb" id="hn">💡 Підказка (3)</button></div><div class="ng${N>5?"":" big"}" style="grid-template-columns:auto repeat(${N},var(--cs))">${g}</div><div class="cmsg"></div><div style="text-align:center"><button class="btn" id="ck">Перевірити</button></div></div>`;
 const cs=[...el.querySelectorAll(".gc")],msg=el.querySelector(".cmsg"),ck=$("ck");
 const paint=c=>{const v=st[+c.dataset.r][+c.dataset.c];c.classList.remove("ok","bad");c.classList.toggle("f",v===1);c.classList.toggle("m",v===2)};
 const grid=el.querySelector(".ng");let drag=null;
 const cellAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.classList.contains("gc")?e:null};
 const setC=(c,v)=>{const r=+c.dataset.r,j=+c.dataset.c;if(st[r][j]!==v){st[r][j]=v;paint(c)}};
 grid.onpointerdown=e=>{if(lock)return;const c=cellAt(e.clientX,e.clientY);if(!c)return;e.preventDefault();
  const r0=+c.dataset.r,c0=+c.dataset.c,b=c.getBoundingClientRect();
  drag={v:st[r0][c0]===mode?0:mode,r0,c0,cx:b.left+b.width/2,cy:b.top+b.height/2,size:b.width,axis:null,last:0};
  setC(c,drag.v);try{grid.setPointerCapture(e.pointerId)}catch(_){}};
 grid.onpointermove=e=>{if(!drag)return;
  if(!drag.axis){const dx=Math.abs(e.clientX-drag.cx),dy=Math.abs(e.clientY-drag.cy);if(Math.max(dx,dy)<drag.size*.6)return;
   drag.axis=dx>=dy?"r":"c";drag.last=drag.axis==="r"?drag.c0:drag.r0}
  const t=drag.axis==="r"?cellAt(e.clientX,drag.cy):cellAt(drag.cx,e.clientY);if(!t)return;
  const k=drag.axis==="r"?+t.dataset.c:+t.dataset.r;
  for(let i=Math.min(k,drag.last);i<=Math.max(k,drag.last);i++)setC(drag.axis==="r"?cs[drag.r0*N+i]:cs[i*N+drag.c0],drag.v);
  drag.last=k};
 grid.onpointerup=grid.onpointercancel=()=>{drag=null};
 [1,2].forEach(m=>$("m"+m).onclick=()=>{mode=m;$("m1").classList.toggle("on",m===1);$("m2").classList.toggle("on",m===2)});
$("hn").onclick=()=>{if(lock||!hints)return;
  const s=steps.find(s=>s.cells.some(([r,c,v])=>v===1?st[r][c]!==1:st[r][c]===1));
  if(!s){msg.textContent="Усе, що можна було підказати, вже позначено. Натисни «Перевірити».";return}
  hints--;$("hn").textContent=`💡 Підказка (${hints})`;if(!hints)$("hn").disabled=true;
  s.cells.forEach(([r,c,v])=>{st[r][c]=v?1:2;const x=cs[r*N+c];paint(x);x.classList.add("hint");setTimeout(()=>x.classList.remove("hint"),3500)});
  const sum=s.cl.reduce((a,b)=>a+b,0),slack=N-(sum+s.cl.length-1),w=s.t==="r"?"рядок":"стовпчик";
  msg.textContent=s.cl[0]===0?`Подивись на ${w} ${s.i+1}: там число 0, тож усі клітинки порожні. Я позначила їх.`:`Подивись на ${w} ${s.i+1} (числа: ${s.cl.join(" ")}). Вільного місця там лише ${slack}, тому частину клітинок видно одразу. Я позначила їх жовтою рамкою.`};
 ck.onclick=()=>{let bad=0,miss=0;
  cs.forEach(c=>{const r=+c.dataset.r,j=+c.dataset.c,f=st[r][j]===1;c.classList.remove("ok","bad");
   if(f){if(sol[r][j])c.classList.add("ok");else{c.classList.add("bad");bad++}}else if(sol[r][j])miss++});
  if(!bad&&!miss){lock=true;cs.forEach(c=>{c.classList.remove("ok","m");if(c.classList.contains("f"))c.classList.add("win")});msg.textContent=`Малюнок з’явився: ${nm.toLowerCase()}!`;ck.textContent="Далі";ck.onclick=done}
  else msg.textContent=bad?`Зайвих клітинок: ${bad} (червоні). Прибери їх і перевір числа.`:`Помилок немає, але зафарбовано ще не все. Перевір числа.`};
}
function genCipher(){
 const WORD="СНІЖОК",U=[...new Set(WORD)],code={},used=new Set();
 const pool=[12,14,15,16,18,21,24,25,27,28,30,32,35,36,40,42,45,48,54,56,60,63,64,72,80,81,84,90,96,105,108,120,126,144,150,168,180];
 shuf(pool).slice(0,U.length).forEach((n,k)=>code[U[k]]=n);
 const expr=N=>{for(let t=0;t<300;t++){let s;
  if(Math.random()<.5){const f=R(2,9);if(N%f)continue;const a=N/f;s=Math.random()<.5?`${a} · ${f}`:`${f} · ${a}`}
  else{const d=R(2,9);if(N*d>999)continue;s=`${N*d} : ${d}`}
  if(!used.has(s)){used.add(s);return s}}return`${N} · 1`};
 return{WORD,U,code,Q:[...WORD].map(ch=>({ch,N:code[ch],e:expr(code[ch])}))}}
function cipher(el,done){
 const {WORD,U,code,Q}=genCipher(),n=Q.length;
 el.innerHTML='<div class="cw"><p style="font-size:15px;text-align:center">Розв’яжи приклади. Літери з ключа складуть слово.</p><p style="text-align:center;font-weight:800;background:#fbeccb;border-radius:10px;padding:8px;margin:6px 0">Ключ: '+shuf(U).map(c=>`${code[c]} = ${c}`).join(" &nbsp; ")+'</p>'+Q.map((q,i)=>`<div class="pb" style="display:flex;align-items:center;gap:8px"><span style="font-size:18px;font-weight:800;min-width:128px">${i+1}. ${q.e} =</span><input class="dg" inputmode="numeric" maxlength="4" autocomplete="off" style="width:76px"></div>`).join("")+'<div class="lock" id="wd"></div><div class="cmsg"></div><div style="text-align:center"><button class="btn" id="ck">Перевірити</button></div></div>';
 const all=[...el.querySelectorAll(".dg")],msg=el.querySelector(".cmsg"),ck=$("ck"),wd=$("wd"),got=Array(n).fill(false);
 const word=()=>wd.textContent=Q.map((q,i)=>got[i]?q.ch:"?").join(" ");word();
 all.forEach((inp,i)=>inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,"");inp.classList.remove("ok","bad");got[i]=false;word()});
 ck.onclick=()=>{let g=0;all.forEach((inp,i)=>{inp.classList.remove("ok","bad");got[i]=Number(inp.value)===Q[i].N&&inp.value!=="";
  if(got[i]){inp.classList.add("ok");g++}else if(inp.value)inp.classList.add("bad")});word();
  if(g===n){all.forEach(i=>i.readOnly=true);msg.textContent=`Шифр розгадано: ${WORD}! Це моє ім’я!`;ck.textContent="Далі";ck.onclick=done}
  else msg.textContent=`Вірно ${g} із ${n}. Виправ червоні відповіді й заповни порожні.`};
}
const SUD=[["24..","1342","4..3","31.."],["32.1","4.2.","2.1.","14.2"],["2...","14.3","..32","3241"],["43.1","2...","123.","34.2"],[".213","..2.",".342","2.31"]];
function sudOk(g,r,c,d){for(let i=0;i<4;i++)if(g[r][i]===d||g[i][c]===d)return false;const r0=r-r%2,c0=c-c%2;for(let i=0;i<2;i++)for(let j=0;j<2;j++)if(g[r0+i][c0+j]===d)return false;return true}
function sudSolutions(g,max){const out=[];(function rec(){if(out.length>=max)return;let br=-1,bc=-1;for(let r=0;r<4&&br<0;r++)for(let c=0;c<4;c++)if(!g[r][c]){br=r;bc=c;break}
 if(br<0){out.push(g.map(r=>[...r]));return}
 for(let d=1;d<=4;d++)if(sudOk(g,br,bc,d)){g[br][bc]=d;rec();g[br][bc]=0}})();return out}
function sudoku(el,done){
 const N=4,g=pick(SUD).map(r=>[...r].map(c=>c==="."?0:+c)),sol=sudSolutions(g.map(r=>[...r]),1)[0],cur=g.map(r=>[...r]);
 let sel=null,lock=false,hints=3;const total=g.flat().filter(v=>!v).length;
 let cells="";for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells+=`<div class="sc${g[r][c]?" g":""}${c===1?" r3":""}${r===1?" b2":""}" data-r="${r}" data-c="${c}">${g[r][c]||""}</div>`;
 el.innerHTML=`<div class="cw" style="--sc:min(64px,calc((100vw - 90px)/4))"><p style="font-size:15px;text-align:center"><b>Рівень 2.</b> Заповни клітинки цифрами від 1 до 4 так, щоб у кожному рядку, стовпчику й блоці 2×2 цифри не повторювалися. Натисни клітинку, потім цифру.</p><div class="sd" style="grid-template-columns:repeat(4,var(--sc))">${cells}</div><div class="kp">`+[1,2,3,4].map(d=>`<button data-d="${d}">${d}</button>`).join("")+`<button data-d="0">⌫</button></div><div style="text-align:center"><button class="mb" id="shn">💡 Підказка (3)</button></div><div class="cmsg"></div><div style="text-align:center"><button class="btn" id="sck">Перевірити</button></div></div>`;
 const cs=[...el.querySelectorAll(".sc")],msg=el.querySelector(".cmsg"),ck=$("sck"),at=(r,c)=>cs[r*N+c];
 const paint=(r,c)=>{const x=at(r,c);x.textContent=cur[r][c]||"";x.classList.remove("ok","bad");if(!g[r][c])x.classList.toggle("u",!!cur[r][c])};
 cs.forEach(x=>x.onclick=()=>{if(lock||x.classList.contains("g"))return;cs.forEach(y=>y.classList.remove("sel"));x.classList.add("sel");sel=[+x.dataset.r,+x.dataset.c]});
 el.querySelectorAll(".kp button").forEach(b=>b.onclick=()=>{if(lock||!sel)return;cur[sel[0]][sel[1]]=+b.dataset.d;paint(sel[0],sel[1])});
 $("shn").onclick=()=>{if(lock||!hints)return;
  const kn=cur.map((row,r)=>row.map((v,c)=>v&&v===sol[r][c]?v:0));
  const seen=(r,c)=>{const s=new Set(),r0=r-r%2,c0=c-c%2;for(let i=0;i<N;i++){s.add(kn[r][i]);s.add(kn[i][c])}for(let i=0;i<2;i++)for(let j=0;j<2;j++)s.add(kn[r0+i][c0+j]);s.delete(0);return s};
  const open=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!kn[r][c])open.push([r,c]);
  if(!open.length){msg.textContent="Усі цифри вже стоять правильно. Натисни «Перевірити».";return}
  let pick1=null,text="";
  for(const [r,c] of open){const s=seen(r,c);if(s.size===N-1){const d=[1,2,3,4].find(x=>!s.has(x));pick1=[r,c,d];text=`У рядку ${r+1} і стовпчику ${c+1} цієї клітинки та в її блоці вже є цифри ${[...s].sort().join(", ")}. Тому тут лишається тільки ${d}.`;break}}
  if(!pick1){const units=[];for(let i=0;i<N;i++){units.push(["рядку "+(i+1),[...Array(N).keys()].map(j=>[i,j])]);units.push(["стовпчику "+(i+1),[...Array(N).keys()].map(j=>[j,i])])}
   for(let b=0;b<N;b++){const r0=Math.floor(b/2)*2,c0=(b%2)*2,u=[];for(let i=0;i<2;i++)for(let j=0;j<2;j++)u.push([r0+i,c0+j]);units.push(["блоці "+(b+1),u])}
   outer:for(const [nm,u] of units)for(let d=1;d<=N;d++){if(u.some(([r,c])=>kn[r][c]===d))continue;const f=u.filter(([r,c])=>!kn[r][c]&&!seen(r,c).has(d));if(f.length===1){pick1=[f[0][0],f[0][1],d];text=`У ${nm} цифра ${d} може стояти тільки в цій клітинці: в інших для неї вже немає місця.`;break outer}}}
  if(!pick1){const [r,c]=open[0];pick1=[r,c,sol[r][c]];text=`Спробуй поставити цифру ${sol[r][c]} у виділену клітинку.`}
  const [r,c,d]=pick1;hints--;$("shn").textContent=`💡 Підказка (${hints})`;if(!hints)$("shn").disabled=true;
  cur[r][c]=d;paint(r,c);const x=at(r,c);x.classList.add("hint");setTimeout(()=>x.classList.remove("hint"),3500);msg.textContent=text};
 ck.onclick=()=>{let ok=0,bad=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(g[r][c])continue;const x=at(r,c);x.classList.remove("ok","bad");
   if(cur[r][c]===sol[r][c]){x.classList.add("ok");ok++}else if(cur[r][c]){x.classList.add("bad");bad++}}
  if(ok===total){lock=true;cs.forEach(y=>y.classList.remove("sel"));msg.textContent="Головоломку розгадано!";ck.textContent="Далі";ck.onclick=done}
  else msg.textContent=(bad?`Помилкових цифр: ${bad} (червоні). `:"")+(ok+bad<total?`Ще не заповнено клітинок: ${total-ok-bad}.`:"")};
}
function japan(el,done){nonogram(el,()=>sudoku(el,done))}
const GAMES={0:crossword,1:lockGame,2:logicGame,3:arcticQuiz,4:japan,5:cipher};
const THX=["Усі слова на місці! Дякую, Мурку. Тримай першу частину мішка. Далі лети до Португалії: там дівчинка Марія знайшла скриню із замком.","Клац! Скриня відчинилася, а всередині — частина чарівного мішка. Дякую, Мурку! Тримай її, а виноградинки візьми на щастя. Далі лети до Лапландії: там ельф геть заплутався.","Ура, тепер кожен подарунок знайде свого власника! Дякую, Мурку. Тримай частину мішка, що завалялася серед подарунків. Далі — на північ, до білого ведмедя.","Ти знаєш усе про Сонце й пори року! Ось частина мішка: вона лежала під снігом. Далі твій шлях лежить до Японії, там на тебе чекає майстер орігамі.","Малюнок відновлено, головоломку розгадано, і мої журавлики вже летять від радості! Тримай частину мішка. Остання зупинка — Антарктида, там на тебе чекає пінгвін.","Так, мене звати Сніжок! Лід розтанув, і мішок знову цілий. Дякую тобі, Мурку, від мене, Сніжка. Тепер усі подарунки повернуться до дітей. Час прикрасити ялинку!"];
function task(i,rep){const p=P[i],g=GAMES[i];
 const play=()=>{show(`<div class="gh"><img src="${CH[i][0]}" alt=""> ${p.who}</div>`+(g?'<div id="gm"></div>':`<div class="stub">Тут буде завдання:<br>${p.task}</div><button class="btn" id="go">Завдання виконано (тест)</button>`),true);
  const fin=()=>rep?hide():thanks(i);
  g?g($("gm"),fin):($("go").onclick=fin)};
 if(rep)play();else{show(`<img class="chr" src="${CH[i][0]}" alt=""><h2>${p.who}</h2><p>${p.say}</p><button class="btn" id="hp">Допомогти</button>`,true);$("hp").onclick=play}}
function thanks(i){S.done=i+1;save();look();
 show(`<div class="pair"><img class="chr" src="${CH[i][1]}" alt=""><img src="${IMG.happy}" alt="" style="height:110px"></div><h2>${P[i].who}</h2><p>${THX[i]}</p><p>Мурко отримав літеру</p><div class="big">${P[i].L}</div><button class="btn" id="nx">Забрати нагороду</button>`);
 $("nx").onclick=()=>{hide();i<P.length-1?walk(i,()=>task(i+1)):finale()};}
function finale(){const w=P.map(p=>p.L).join("");
 show(`<img class="spr" src="${IMG.happy}" alt=""><h2>Мішок зібрано!</h2><p>Усі літери разом дають ключове слово:</p><div class="big">${w}</div><p>Подарунки повернулися. Час прикрасити ялинку!</p><a class="btn" href="https://lvnotes.github.io/christmas_tree/" target="_blank" rel="noopener">До ялинки</a><br><button class="btn btn2" id="rp" style="margin:10px 0 0">Пройти квест заново</button><p style="font-size:14px">Або закрий вікно й натисни на будь-яку пройдену точку, щоб потренуватися.</p>`,true);
 $("rp").onclick=()=>{S={done:0,seen:false};save();location.reload()};}
function intro(){show(`<img class="spr" src="${IMG.wow}" alt=""><h2>Біда!</h2><p>Напередодні Нового року чарівний мішок із подарунками порвався, а подарунки розлетілися по світу. Допоможи Мурку їх зібрати!</p><button class="btn" id="st">Вирушаємо!</button>`);
 $("st").onclick=()=>{S.seen=true;save();hide()};}
function tap(i){if(busy||ov.classList.contains("show"))return;if(i<S.done)task(i,true);else if(i===S.done&&S.done<P.length)task(i)}
$("rs").onclick=()=>{if(confirm("Почати подорож спочатку?")){S={done:0,seen:false};save();location.reload()}};
const at=Math.min(S.done,P.length-1);place(P[at].x,P[at].y,false);look();
addEventListener("load",()=>{focusMk();S.done>=P.length?finale():!S.seen&&intro()});
addEventListener("resize",focusMk);
